name: Hydrate migrated large assets

on:
  push:
    branches:
      - migration/cafe-filosofico-20261103
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hydrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/cafe-filosofico-20261103
          fetch-depth: 0

      - name: Restore large binary assets from source commits
        shell: bash
        run: |
          set -euo pipefail

          download_exact() {
            local url="$1"
            local path="$2"
            local expected="$3"

            mkdir -p "$(dirname "$path")"

            local current=0
            if [ -f "$path" ]; then
              current="$(wc -c < "$path" | tr -d ' ')"
            fi

            if [ "$current" != "$expected" ]; then
              echo "Restoring $path ($current -> $expected bytes)"
              curl --fail --location --retry 3 --silent --show-error "$url" --output "$path"
            fi

            local actual
            actual="$(wc -c < "$path" | tr -d ' ')"
            if [ "$actual" != "$expected" ]; then
              echo "Size mismatch for $path: expected $expected, got $actual" >&2
              exit 1
            fi
          }

          SOURCE="https://raw.githubusercontent.com/kychan00/philosophia/2e04e718613b85269b2ca6708a8378add1ed7270"
          OFFICIAL="https://raw.githubusercontent.com/ResearchUDG/philosophia/cca1da4558bcbf8053cf7365274122d450fabf16"

          download_exact "$SOURCE/public/images/cafe-filosofico/01.png" "public/images/cafe-filosofico/01.png" 3163804
          download_exact "$SOURCE/public/images/cafe-filosofico/02.png" "public/images/cafe-filosofico/02.png" 3199951
          download_exact "$SOURCE/public/images/cafe-filosofico/03.png" "public/images/cafe-filosofico/03.png" 3247733
          download_exact "$SOURCE/public/images/cafe-filosofico/04.png" "public/images/cafe-filosofico/04.png" 3139097
          download_exact "$SOURCE/public/images/cafe-filosofico/05.png" "public/images/cafe-filosofico/05.png" 2770964
          download_exact "$SOURCE/public/images/cafe-filosofico/cafe-hero.png" "public/images/cafe-filosofico/cafe-hero.png" 2204052
          download_exact "$SOURCE/public/images/cafe-filosofico/meritocracia/aristotle-bust.png" "public/images/cafe-filosofico/meritocracia/aristotle-bust.png" 4007507
          download_exact "$SOURCE/public/images/cafe-filosofico/session-01-thumb.png" "public/images/cafe-filosofico/session-01-thumb.png" 3247733
          download_exact "$OFFICIAL/public/images/cafe-filosofico/redes-sociales/poster-oficial.png" "public/images/cafe-filosofico/redes-sociales/poster-oficial.png" 3862715

      - name: Commit restored assets
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- public/images/cafe-filosofico; then
            echo "Large assets already hydrated."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add --             public/images/cafe-filosofico/01.png             public/images/cafe-filosofico/02.png             public/images/cafe-filosofico/03.png             public/images/cafe-filosofico/04.png             public/images/cafe-filosofico/05.png             public/images/cafe-filosofico/cafe-hero.png             public/images/cafe-filosofico/meritocracia/aristotle-bust.png             public/images/cafe-filosofico/session-01-thumb.png             public/images/cafe-filosofico/redes-sociales/poster-oficial.png

          git commit -m "fix: restaurar binarios grandes de la migración"
          git push origin HEAD:migration/cafe-filosofico-20261103
