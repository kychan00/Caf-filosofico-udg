name: Validate Café Filosófico

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: node tests/cafe-agua-browser-smoke.mjs
      - run: node tests/cafe-redes-sociales-browser-smoke.mjs
      - run: node tests/cafe-inteligencia-artificial-browser-smoke.mjs
